name: release

# Uses npm Trusted Publisher (OIDC). Configure it on npm:
# package Settings -> Trusted Publisher -> GitHub Actions
# owner: CQ-Developer, repository: pi-qq, workflow: release.yml

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: Verify version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          LOCK="$(node -p "require('./package-lock.json').version")"
          test "$TAG" = "$PKG"
          test "$TAG" = "$LOCK"
          echo "version=$TAG"

      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm pack --dry-run

      - name: Publish npm package
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "@chen_hu_hu/pi-qq@$VERSION" version >/dev/null 2>&1; then
            echo "npm already has @chen_hu_hu/pi-qq@$VERSION; skipping publish"
          else
            npm publish --access public --provenance
          fi

      - name: Prepare release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { in_section = 1; next }
            in_section && /^## \[/ { exit }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "No CHANGELOG.md section found for $VERSION" >&2
            exit 1
          fi
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^{commit}^")"
          printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
            "$GITHUB_REPOSITORY" "$PREVIOUS_TAG" "$GITHUB_REF_NAME" >> release-notes.md

      - name: Prepare release artifacts
        run: |
          ASSET_DIR="$RUNNER_TEMP/release-assets"
          mkdir -p "$ASSET_DIR"
          npm pack --pack-destination "$ASSET_DIR"
          cd "$ASSET_DIR"
          sha256sum ./*.tgz > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSET_DIR="$RUNNER_TEMP/release-assets"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub Release $GITHUB_REF_NAME already exists; uploading assets"
            gh release upload "$GITHUB_REF_NAME" "$ASSET_DIR"/*.tgz "$ASSET_DIR"/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --notes-file release-notes.md \
              --title "pi-qq $GITHUB_REF_NAME" \
              "$ASSET_DIR"/*.tgz "$ASSET_DIR"/SHA256SUMS
          fi
