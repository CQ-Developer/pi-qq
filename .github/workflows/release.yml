name: release

# Requires repository secret NPM_TOKEN with publish permission and 2FA bypass for CI.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: Verify version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          LOCK="$(node -p "require('./package-lock.json').version")"
          test "$TAG" = "$PKG"
          test "$TAG" = "$LOCK"
          echo "version=$TAG"

      - run: npm test
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm pack --dry-run

      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "@chen_hu_hu/pi-qq@$VERSION" version >/dev/null 2>&1; then
            echo "npm already has @chen_hu_hu/pi-qq@$VERSION; skipping publish"
          else
            npm publish --access public --provenance
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub Release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --generate-notes \
              --title "pi-qq $GITHUB_REF_NAME"
          fi
